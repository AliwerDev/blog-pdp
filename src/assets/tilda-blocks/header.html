<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ Accordion</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <style>
      #header,
      #header * {
        box-sizing: border-box;
        font-family: "sharp", Arial, sans-serif !important;
      }
      #header {
        background: transparent;
        position: sticky;
        top: 0;
        padding-inline: 25px;
        left: 0;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1080px;
        margin: 0 auto;
        height: 56px;
        background: white;
        border-radius: 100px;
        padding: 0 16px;
      }

      .logos {
        display: flex;
        align-items: center;
      }
      .logos .v_line {
        width: 1px;
        height: 20px;
        background: #00000088;
        margin: 0 10px;
      }
      .logos > div {
        display: flex;
        align-items: center;
        cursor: pointer;
      }
      .logo_ecosystem {
        width: 36px;
        overflow: hidden;
        transition: all 0.3s ease-in-out;
      }

      .logo_ecosystem:hover {
        width: 140px;
      }

      .logo_ecosystem svg {
        min-width: 157px;
      }

      .logos svg {
        min-height: 36px;
        margin-inline: -10px;
        height: 36px;
      }

      .menu {
        display: flex;
        gap: 30px;
      }
      .menu a {
        text-decoration: none;
        color: #000000;
        font-size: 14px;
        line-height: 20px;
        transition: all 0.3s ease-in-out;
        text-transform: uppercase;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .menu_icon {
        height: fit-content;
        display: flex;
        align-items: center;
        cursor: pointer;
        display: none;
        transform: scale(0.8);
      }
      .language {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .language span {
        font-size: 12px;
        cursor: pointer;
        transition: all 0.3s ease-in-out;
        text-transform: uppercase;
      }

      .primary_btn {
        display: flex;
        align-items: center;
        gap: 15px;
        height: 40px;
        text-transform: uppercase;
        color: white;
        padding-inline: 30px;
        border-radius: 20px;
        background: #000000;
        font-size: 14px;
        font-weight: 400;
        cursor: pointer;
      }
      .primary_btn svg {
        margin-right: -6px;
      }

      @media (max-width: 1080px) {
        .menu {
          gap: 20px;
        }
        .menu a {
          font-size: 13px;
        }
        .primary_btn {
          padding-inline: 20px;
        }
      }

      @media (max-width: 990px) {
        #header {
          padding-inline: 20px;
        }
        .logo_ecosystem {
          width: 28px;
          overflow: hidden;
          transition: all 0.3s ease-in-out;
        }

        .menu a {
          font-size: 12px;
        }

        .logo_ecosystem:hover {
          width: 28px;
        }

        .logo_ecosystem svg {
          min-width: 150px;
        }

        .logos svg {
          min-height: 30px;
          margin-inline: -20px;
          height: 30px;
        }
        .primary_btn {
          height: 35px;
          font-size: 13px;
        }
      }

      @media (max-width: 880px) {
        #header {
          padding-inline: 15px;
        }
        .menu {
          display: none;
        }
        .menu_icon {
          display: block;
        }
        .actions {
          gap: 10px;
        }
        .language span {
          font-size: 10px;
        }
        .primary_btn {
          padding-inline: 15px;
          height: 30px;
          font-size: 12px;
        }
        .primary_btn svg {
          margin-right: -4px;
        }
      }
    </style>
  </head>

    <script>
      $(document).ready(function () {
        const faqs = [
          { question: "PDP Academy ish bilan ta’minlaydimi?", answer: "Answer of PDP Academy ish bilan ta’minlaydimi?" },
          { question: "Necha yoshdan kurslarga qabul qilinadi?", answer: "Answer of Necha yoshdan kurslarga qabul qilinadi?" },
          { question: "Mentorlar (o‘qituvchilar) portfoliosi haqida ma’lumot bormi?", answer: "Answer of Mentorlar (o‘qituvchilar) portfoliosi haqida ma’lumot bormi?" },
          { question: "PDP Academy’ning boshqa viloyatlarda filiallari mavjudmi?", answer: "Answer of PDP Academy’ning boshqa viloyatlarda filiallari mavjudmi?" },
          { question: "PDP Academy tomonidan taqdim etilgan sertifikat hamma joyga o‘tadimi?", answer: "Answer of PDP Academy tomonidan taqdim etilgan sertifikat hamma joyga o‘tadimi? Answer of PDP Academy tomonidan taqdim etilgan sertifikat hamma joyga o‘tadimi? Answer of PDP Academy tomonidan taqdim etilgan sertifikat hamma joyga o‘tadimi?" },
        ];

        const accordionContainer = $("#accordion");

        faqs.forEach((faq) => {
          const item = $('<div class="accordion-item"></div>');
          const header = $(`
            <div class="accordion-header">
              <span>${faq.question}</span>
              <span class="icon">
                <svg width="14" height="9" viewBox="0 0 14 9" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1 1.58887L7 7.58887L13 1.58887" stroke="#555A65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </div>`);
          const content = $(`<div class="accordion-content">${faq.answer}</div>`);

          header.on("click", function () {
            if (content.is(":visible")) {
              content.slideUp(200);
              item.removeClass("open");
              header.find(".svg").css("transform", "rotate(0deg)");
            } else {
              content.slideDown(200);
              item.addClass("open");
              header.find(".svg").css("transform", "rotate(45deg)");
            }
          });

          item.append(header, content);
          accordionContainer.append(item);
        });
      });
    </script>
