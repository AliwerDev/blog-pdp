<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ Accordion</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <style>
      .wrapper {
        background-color: #f5f5f5;
        padding: 30px;
        margin: 0;
        max-width: 100vw;
        box-sizing: border-box;
      }

      .wrapper * {
        box-sizing: border-box;
      }

      .container {
        font-family: "sharp", Arial, sans-serif !important;
        background: white;
        border-radius: 20px;
        max-width: 1180px;
        padding: 80px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        user-select: none;
      }

      .left {
        display: flex;
        flex-direction: column;
        gap: 25px;
        align-items: start;
      }

      .left h2 {
        font-size: 50px;
        font-weight: 500;
        margin: 0;
        width: 70%;
        line-height: 1.2;
      }

      .left p a {
        color: #00c508;
      }

      .left a {
        text-decoration: none;
      }

      .left p {
        font-size: 14px;
        font-weight: 400;
        margin: 0;
        width: 70%;
      }

      .left button {
        border: 0;
        outline: none;
        background-color: #00c508;
        display: flex;
        gap: 10px;
        padding: 4px 15px;
        border-radius: 10px;
        cursor: pointer;
        color: white;
        align-items: center;
      }

      .right .icon {
        min-width: 20px;
        min-height: 20px;
        border-radius: 50%;
        background-color: #f7f8fa;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.2s linear;
        perspective: 50px;
      }

      .icon svg {
        transform: scale(0.7);
        transition: all 0.2s linear;
      }

      .accordion-item {
        margin: 10px 0;
        overflow: hidden;
        padding: 15px 0;
        cursor: pointer;
        box-sizing: border-box;
        border-bottom: 1px solid #d7dae2;
      }

      .accordion-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        transition: all 0.2s linear;
      }

      .accordion-content {
        display: none;
        font-size: 14px;
        margin-top: 10px;
        line-height: 1.5;
      }

      .accordion-item.open .accordion-header {
        color: #00b533;
      }

      .accordion-item.open .icon svg {
        transform: scale(0.7) rotateX(180deg);
      }

      @media (max-width: 880px) {
        .container {
          padding: 60px;
          flex-direction: column;
          grid-template-columns: 100%;
        }

        .left h2 {
          font-size: 40px;
          width: 100%;
        }

        .left p {
          width: 100%;
          font-size: 13px;
        }

        .left button {
          padding: 3px 12px;
          font-size: 14px;
        }

        .right {
          margin-top: 20px;
        }

        .accordion-content {
          font-size: 13px;
        }
      }

      @media (max-width: 576px) {
        .wrapper {
          padding: 20px;
        }
        .container {
          padding: 40px;
        }

        .left {
          align-items: center;
          text-align: center;
        }

        .left h2 {
          font-size: 32px;
        }

        .left p {
          font-size: 12px;
        }

        .left button {
          padding: 2px 10px;
          font-size: 12px;
          border-radius: 8px;
        }

        .accordion-item {
          padding: 10px 0;
        }

        .accordion-header {
          font-size: 14px;
        }

        .accordion-content {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <div class="left">
          <h2 class="faq_accardion_title">Tez-tez beriladigan savollar</h2>
          <p class="faq_accardion_description">Savollaringiz bormi? Istalgan vaqtda bizga elektron pochtamizga <a href="mailto:pdpinvest@gmail.com">pdpinvest@gmail.com</a> xabaringizini yuborishingiz mumkin.</p>
          <a href="https://t.me/PDPSupportBot">
            <button class="faq_accardion_tg_btn">
              Telegram
              <svg width="24" height="25" viewBox="0 0 24 25" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 12.5889H19" stroke="white" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M12 5.58887L19 12.5889L12 19.5889" stroke="white" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </a>
        </div>
        <div class="right"><div id="accordion"></div></div>
      </div>
    </div>
    <script>
      $(document).ready(function () {
        const accordionContainer = $("#accordion");

        // Notion API dan ma'lumot olish
        async function fetchFAQs() {
          try {
            const response = await fetch("https://notion-api.pdp.uz?database_id=19df4e0aaef38010a1cfdf1ee6259598");
            const data = await response.json();

            const faqs = data.results.map((item) => ({
              question: item.properties.Name.title[0]?.text.content || "No question",
              answer: item.properties.Javobi.rich_text[0]?.text.content || "No answer",
            }));

            renderFAQs(faqs);
          } catch (error) {
            console.error("Error fetching FAQs:", error);
          }
        }

        function renderFAQs(faqs) {
          accordionContainer.empty(); // Eski contentni tozalash

          faqs.forEach((faq) => {
            const item = $('<div class="accordion-item"></div>');
            const header = $(`
              <div class="accordion-header">
                <span>${faq.question}</span>
                <span class="icon">
                  <svg width="14" height="9" viewBox="0 0 14 9" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 1.58887L7 7.58887L13 1.58887" stroke="#555A65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </span>
              </div>`);
            const content = $(`<div class="accordion-content">${faq.answer}</div>`);

            header.on("click", function () {
              if (content.is(":visible")) {
                content.slideUp(200);
                item.removeClass("open");
              } else {
                content.slideDown(200);
                item.addClass("open");
              }
            });

            item.append(header, content);
            accordionContainer.append(item);
          });
        }

        fetchFAQs(); // Funksiyani chaqiramiz
      });
    </script>
  </body>
</html>
