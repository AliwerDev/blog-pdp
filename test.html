<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ Accordion</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <style>
      .wrapper {
        width: 100%;
        background-color: #f5f5f5;
        padding: 50px 0;
        margin: 0;
      }

      .container {
        background: white;
        border-radius: 20px;
        width: 100%;
        max-width: 1180px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding-block: 80px;
        margin: 0 auto;
        font-family: "sharp", Arial, sans-serif;
      }
      .accordion-item {
        margin: 10px 0;
        border-radius: 5px;
        overflow: hidden;
        border-radius: 10px;
        padding: 15px;
        background: #f8f8f8;
        cursor: pointer;
        width: 700px;
        box-sizing: border-box;
      }
      .accordion-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.2s linear;
      }
      .accordion-header .svg {
        min-width: 20px;
        transition: all 0.2s linear;
      }

      .accordion-content {
        display: none;
        font-size: 14px;
        margin-top: 10px;
      }
      .accordion-item.open .accordion-header {
        color: #00b533;
      }
      .accordion-item.open .svg {
        transform: rotate(45deg);
      }
      .accordion-item.open .svg path {
        fill: #9a9898 !important;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <h2>Tez-tez beriladigan savollar</h2>
        <div id="accordion"></div>
      </div>
    </div>
    <script>
      $(document).ready(function () {
        const faqs = [
          { question: "PDP Academy ish bilan ta’minlaydimi?", answer: "Answer of PDP Academy ish bilan ta’minlaydimi?" },
          { question: "Necha yoshdan kurslarga qabul qilinadi?", answer: "Answer of Necha yoshdan kurslarga qabul qilinadi?" },
          { question: "Mentorlar (o‘qituvchilar) portfoliosi haqida ma’lumot bormi?", answer: "Answer of Mentorlar (o‘qituvchilar) portfoliosi haqida ma’lumot bormi?" },
          { question: "PDP Academy’ning boshqa viloyatlarda filiallari mavjudmi?", answer: "Answer of PDP Academy’ning boshqa viloyatlarda filiallari mavjudmi?" },
          { question: "PDP Academy tomonidan taqdim etilgan sertifikat hamma joyga o‘tadimi?", answer: "Answer of PDP Academy tomonidan taqdim etilgan sertifikat hamma joyga o‘tadimi? Answer of PDP Academy tomonidan taqdim etilgan sertifikat hamma joyga o‘tadimi? Answer of PDP Academy tomonidan taqdim etilgan sertifikat hamma joyga o‘tadimi?" },
        ];

        const accordionContainer = $("#accordion");

        faqs.forEach((faq) => {
          const item = $('<div class="accordion-item"></div>');
          const header = $(`
            <div class="accordion-header">
              <span>${faq.question}</span>
              <svg class="svg" width="21" height="21" viewBox="0 0 21 21" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3.5127 9.87136C3.5127 10.2813 3.85566 10.6158 4.25718 10.6158H9.66935V16.028C9.66935 16.4296 10.004 16.7725 10.4138 16.7725C10.8237 16.7725 11.1667 16.4296 11.1667 16.028V10.6158H16.5705C16.972 10.6158 17.315 10.2813 17.315 9.87136C17.315 9.46147 16.972 9.1185 16.5705 9.1185H11.1667V3.7147C11.1667 3.31318 10.8237 2.97021 10.4138 2.97021C10.004 2.97021 9.66935 3.31318 9.66935 3.7147V9.1185H4.25718C3.85566 9.1185 3.5127 9.46147 3.5127 9.87136Z" fill="#00B533"/>
              </svg>
            </div>`);
          const content = $(`<div class="accordion-content">${faq.answer}</div>`);

          header.on("click", function () {
            if (content.is(":visible")) {
              content.slideUp(200);
              item.removeClass("open");
              header.find(".svg").css("transform", "rotate(0deg)");
            } else {
              content.slideDown(200);
              item.addClass("open");
              header.find(".svg").css("transform", "rotate(45deg)");
            }
          });

          item.append(header, content);
          accordionContainer.append(item);
        });
      });
    </script>
  </body>
</html>
